pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx oxlint {staged_files}

    - name: oxfmt
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,mdx,yml,yaml,css,astro}"
      exclude: "**/CHANGELOG.md"
      run: bunx oxfmt {staged_files}
      stage_fixed: true
